[project]
name = "sketch2code"
version = "2.0.0"
description = "Kâğıt çizimi fotoğrafından çalışan HTML sayfası: CV ön işleme + Gemini + güvenli önizleme."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Sabit sürümler requirements.txt içindedir (tekrarlanabilir kurulum).
dependencies = [
    "streamlit>=1.67,<2",
    "opencv-python-headless>=5.1,<6",
    "numpy>=2.5,<3",
    "pillow>=13,<14",
    "google-genai>=3.6,<4",
    "scikit-learn>=1.9,<2",
    "pydantic>=2.14,<3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6", "playwright==1.65.2"]

[tool.setuptools]
packages = ["sketch2code"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Türkçe metindeki tipografik karakterler bilinçli

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["browser: gerçek tarayıcı (Playwright) gerektirir"]
filterwarnings = ["ignore::DeprecationWarning:sklearn.*"]
